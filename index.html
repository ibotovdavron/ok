<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TürkBilim — Turkiy dunyoda bilim almashaylik</title>
<meta name="description" content="Turkiy davlatlar yoshlari o‘z sohalaridagi bilim, tajriba va kashfiyotlarni maqollar bilan ulashadigan maydon.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="#top"><span class="logo">🐺</span><span>Türk<b>Bilim</b></span></a>
  <div class="nav-right">
    <select id="lang" aria-label="Til / Dil / Тіл"></select>
    <div id="user" class="user" hidden>
      <img id="avatar" alt="">
      <button class="btn ghost small" data-i18n="logout" id="logout"></button>
    </div>
    <button class="btn google small" id="login">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span data-i18n="join"></span>
    </button>
  </div>
</header>

<section class="hero" id="top">
  <div class="hero-text">
    <div class="flags" id="flags"></div>
    <h1 data-i18n="slogan"></h1>
    <p data-i18n="heroText"></p>
    <div class="actions">
      <button class="btn" id="shareBtn" data-i18n="share"></button>
      <a class="btn ghost" href="#feed" data-i18n="explore"></a>
    </div>
    <div class="stats">
      <div><strong id="sPosts">0</strong><span data-i18n="statPosts"></span></div>
      <div><strong id="sMembers">0</strong><span data-i18n="statMembers"></span></div>
      <div><strong>6</strong><span data-i18n="statCountries"></span></div>
    </div>
  </div>
  <aside class="proverb-card">
    <small data-i18n="proverbDay"></small>
    <blockquote id="proverb"></blockquote>
    <span id="proverbFrom"></span>
  </aside>
</section>

<p class="demo" id="demo" data-i18n="demoNote" hidden></p>

<section class="sec" id="sections">
  <h2 data-i18n="sections"></h2>
  <div class="cats" id="cats"></div>
</section>

<section class="sec" id="feed">
  <div class="feed-head">
    <h2 data-i18n="latest"></h2>
    <div class="filters">
      <input id="q" type="search" data-i18n-ph="search">
      <select id="countryFilter"></select>
    </div>
  </div>
  <div class="grid" id="posts"></div>
  <p class="empty" id="empty" data-i18n="empty" hidden></p>
</section>

<footer>
  <div class="ornament"></div>
  <p><b>TürkBilim</b> — <span data-i18n="footer"></span></p>
  <p class="muted">🇺🇿 🇹🇷 🇰🇿 🇦🇿 🇰🇬 🇹🇲</p>
</footer>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 data-i18n="formTitle"></h3>
    <label><span data-i18n="fTitle"></span><input id="fTitle" maxlength="120" required></label>
    <div class="row">
      <label><span data-i18n="fCategory"></span><select id="fCategory"></select></label>
      <label><span data-i18n="fCountry"></span><select id="fCountry"></select></label>
    </div>
    <label><span data-i18n="fBody"></span><textarea id="fBody" rows="6" maxlength="4000" required></textarea></label>
    <label><span data-i18n="fProverb"></span><input id="fProverb" maxlength="200" data-i18n-ph="fProverbHint" required></label>
    <div class="actions end">
      <button type="button" class="btn ghost" id="cancel" data-i18n="cancel"></button>
      <button type="submit" class="btn" data-i18n="publish"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
